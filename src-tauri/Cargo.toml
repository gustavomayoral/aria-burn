[package]
name = "aria-burn"
version = "0.1.0"
description = "Aria Burn: laser-engraver burn simulator"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
# The _lib suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "aria_burn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
aria-burn-contract.workspace = true
aria-burn-gcode.workspace = true
aria-burn-grbl.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-store = "2.5"
# Native Save / Open dialogs for project files (BURN-55).
tauri-plugin-dialog = "2.8"
# Same major as Tauri uses, for the per-user folders it names after the identifier.
dirs = "7"
