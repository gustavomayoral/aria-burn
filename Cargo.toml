[workspace]
resolver = "3"
members = ["src-tauri", "crates/aria-burn-contract", "crates/aria-burn-gcode", "crates/aria-burn-grbl"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"

[workspace.dependencies]
aria-burn-contract = { path = "crates/aria-burn-contract" }
aria-burn-gcode = { path = "crates/aria-burn-gcode" }
aria-burn-grbl = { path = "crates/aria-burn-grbl" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
